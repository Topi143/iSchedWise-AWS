<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - iSchedWise</title>
    <script>
        // FOUC prevention - apply dark mode before rendering
        (function() {
            try {
                if (localStorage.getItem('ischedwise_dark_mode') === 'true') {
                    document.documentElement.classList.add('dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center transition-colors duration-200">
    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-lg max-w-md w-full mx-4 p-8 text-center">
        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center">
            <svg class="w-8 h-8 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
            </svg>
        </div>
        <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-2">System Maintenance</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-6">{{ message }}</p>
        <a href="{{ url_for('auth.logout') }}" data-logout-trigger class="inline-block text-sm text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 font-medium transition-colors">
            &larr; Back to Login
        </a>
    </div>

    <div id="maintenanceLogoutModal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="maintenanceLogoutTitle">
        <div id="maintenanceLogoutBackdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl w-full max-w-sm p-5 shadow-xl">
                <div class="w-10 h-10 mx-auto mb-3 bg-amber-100 dark:bg-amber-900/30 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </div>

                <h3 id="maintenanceLogoutTitle" class="text-base font-semibold text-gray-900 dark:text-white text-center mb-2">Sign out?</h3>
                <p class="text-sm text-gray-600 dark:text-gray-400 text-center mb-5">You will be logged out and redirected to the login page.</p>

                <div class="flex flex-col-reverse sm:flex-row gap-2">
                    <button id="maintenanceLogoutCancel" type="button" class="flex-1 px-4 py-2 rounded-lg text-sm font-medium border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 dark:bg-gray-700 dark:text-gray-200 dark:border-gray-600 dark:hover:bg-gray-600 transition-colors">
                        Cancel
                    </button>
                    <a id="maintenanceLogoutConfirm" href="{{ url_for('auth.logout') }}" class="flex-1 px-4 py-2 rounded-lg text-sm font-medium bg-red-600 text-white hover:bg-red-700 transition-colors text-center">
                        Sign Out
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function initMaintenanceLogoutConfirmation() {
            const modal = document.getElementById('maintenanceLogoutModal');
            const backdrop = document.getElementById('maintenanceLogoutBackdrop');
            const cancelBtn = document.getElementById('maintenanceLogoutCancel');
            const confirmBtn = document.getElementById('maintenanceLogoutConfirm');
            const trigger = document.querySelector('[data-logout-trigger]');

            if (!modal || !confirmBtn || !trigger) return;

            const defaultLogoutHref = confirmBtn.getAttribute('href') || '';
            let previousBodyOverflow = '';

            function openLogoutModal(href) {
                confirmBtn.setAttribute('href', href || defaultLogoutHref);
                previousBodyOverflow = document.body.style.overflow;
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            function closeLogoutModal() {
                modal.classList.add('hidden');
                document.body.style.overflow = previousBodyOverflow || '';
            }

            trigger.addEventListener('click', function(event) {
                event.preventDefault();
                openLogoutModal(trigger.getAttribute('href'));
            });

            if (backdrop) {
                backdrop.addEventListener('click', closeLogoutModal);
            }

            if (cancelBtn) {
                cancelBtn.addEventListener('click', closeLogoutModal);
            }

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
                    event.preventDefault();
                    closeLogoutModal();
                }
            });
        })();
    </script>
</body>
</html>

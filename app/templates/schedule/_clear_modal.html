<!-- Clear Schedules Confirmation Modal -->
<div id="clearModal" class="fixed inset-0 z-[9999] hidden" data-force-sidebar-dim="true" data-sidebar-dim-alpha="0.5">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeClearModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-md p-6" onclick="event.stopPropagation()">
            
            <!-- Header -->
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                </div>
                <div>
                    <h4 class="text-base font-semibold text-gray-900 dark:text-white">Clear Schedules</h4>
                    <p class="text-xs text-gray-500 dark:text-gray-400" id="clearModalSubtitle">Remove schedules for the current semester</p>
                </div>
            </div>

            <!-- Scope Selection -->
            <div class="mb-4 space-y-2">
                {% if current_user.is_admin %}
                <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-2">What do you want to clear?</label>
                
                <!-- Option: Selected Section -->
                <label id="clearSectionOption" class="flex items-center gap-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 cursor-pointer hover:border-amber-300 dark:hover:border-amber-700 hover:bg-amber-50/50 dark:hover:bg-amber-900/10 transition-all has-[:checked]:border-amber-400 has-[:checked]:bg-amber-50 dark:has-[:checked]:border-amber-600 dark:has-[:checked]:bg-amber-900/20">
                    <input type="radio" name="clearScope" value="section" class="w-4 h-4 text-amber-600 focus:ring-amber-500" checked>
                    <div class="flex-1">
                        <span class="text-sm font-medium text-gray-900 dark:text-gray-200">Selected section only</span>
                        <p class="text-xs text-gray-500 dark:text-gray-400" id="clearSectionLabel">Select a section first</p>
                    </div>
                    <span id="clearSectionCount" class="px-2 py-0.5 text-xs font-bold rounded-full bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300">0</span>
                </label>

                {% if current_user.is_admin %}
                <!-- Option: All Semester -->
                <label class="flex items-center gap-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 cursor-pointer hover:border-red-300 dark:hover:border-red-700 hover:bg-red-50/50 dark:hover:bg-red-900/10 transition-all has-[:checked]:border-red-400 has-[:checked]:bg-red-50 dark:has-[:checked]:border-red-600 dark:has-[:checked]:bg-red-900/20">
                    <input type="radio" name="clearScope" value="semester" class="w-4 h-4 text-red-600 focus:ring-red-500">
                    <div class="flex-1">
                        <span class="text-sm font-medium text-gray-900 dark:text-gray-200">All semester schedules</span>
                        <p class="text-xs text-gray-500 dark:text-gray-400" id="clearSemesterLabel">Clears everything for the current semester</p>
                    </div>
                    <span id="clearSemesterCount" class="px-2 py-0.5 text-xs font-bold rounded-full bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300">—</span>
                </label>
                {% endif %}
                {% else %}
                <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-2">Section to clear</label>
                <label id="clearSectionOption" class="flex items-start gap-3 p-3 rounded-lg border border-amber-200 dark:border-amber-800 bg-amber-50/40 dark:bg-amber-900/10">
                    <input type="radio" name="clearScope" value="section" class="hidden" checked>
                    <div class="flex-1">
                        <span class="text-sm font-medium text-gray-900 dark:text-gray-200" id="clearSectionLabel">Select a section first</span>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Only the selected section will be cleared.</p>
                    </div>
                </label>
                {% endif %}
            </div>

            <!-- Safety Note -->
            <div class="flex items-start gap-2 p-3 rounded-lg bg-teal-50 dark:bg-teal-900/20 border border-teal-200 dark:border-teal-800 mb-5">
                <svg class="w-4 h-4 text-teal-600 dark:text-teal-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                <p class="text-xs text-teal-700 dark:text-teal-300">A backup snapshot will be created automatically before clearing, so you can restore if needed.</p>
            </div>

            <!-- Actions -->
            <div class="flex gap-3 justify-end">
                <button onclick="closeClearModal()" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">Cancel</button>
                <button onclick="executeClear()" id="confirmClearBtn" class="px-4 py-2 text-sm font-semibold text-white bg-amber-600 rounded-lg hover:bg-amber-700 transition-colors">
                    <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    Clear Schedules
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    /* Custom Scrollbar - Consistent with base.html and settings.html */

    }

    /* Consistent table styling */
    table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
    }
    
    table thead {

    table th:last-child {
        text-align: right;
    }

        background-color: white;

    }
    
    /* Scrollbar styling for table container */
    .table-container::-webkit-scrollbar {
        width: 5px;
        height: 5px;
    }
    
    .table-container::-webkit-scrollbar-track {
        background: transparent;
        border-radius: 4px;

        border-radius: 4px;
    }

    /* Toast Notifications - Enhanced design */
    .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 400px;
    }
    
    .toast {
        display: flex;
        align-items: center;
        padding: 1rem;
        background: white;
        border-radius: 0.75rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        transform: translateX(400px);
        animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        min-width: 300px;
        border: 1px solid #e5e7eb;
    }
    
    .toast.removing {
        animation: slideOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    
    @keyframes slideIn {
        to {
            transform: translateX(0);
        }
    }
    
    @keyframes slideOut {
        to {
            transform: translateX(400px);
            opacity: 0;
        }
    }
    
    .toast-success { 
        border-left: 4px solid #10b981;
        background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
    }
    .toast-error { 
        border-left: 4px solid #ef4444;
        background: linear-gradient(135deg, #ffffff 0%, #fef2f2 100%);
    }
    .toast-info { 
        border-left: 4px solid #3b82f6;
        background: linear-gradient(135deg, #ffffff 0%, #eff6ff 100%);
    }
    
    .toast-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: currentColor;
        opacity: 0.3;
        animation: progress 5s linear forwards;
        border-radius: 0 0 0.75rem 0.75rem;
    }
    
    @keyframes progress {
        to {
            width: 0;
        }
    }
    
    /* Day of week badges */
    .day-badge {
        display: inline-block;
        padding: 0.25rem 0.625rem;
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: 0.5rem;
    }

    .day-tuesday { background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%); color: #9f1239; border: 1px solid #f9a8d4; }
    .day-wednesday { background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); color: #166534; border: 1px solid #86efac; }

    .day-saturday { background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%); color: #6b21a8; border: 1px solid #d8b4fe; }
    .day-sunday { background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%); color: #991b1b; border: 1px solid #fca5a5; }
    
    /* Tab Styles - Consistent with settings */

        color: #64748b;
        background: transparent;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

        height: 5px;

        background: transparent;
        border-radius: 4px;
    }
    
    .calendar-grid::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 4px;
    }
    
    .calendar-grid::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
    }
    
    .calendar-grid > div {
        display: grid;
        min-width: 800px; /* Minimum width to prevent cramping */
    }
    
    /* Ensure grid doesn't overflow but allows scroll */
    .calendar-grid .grid-cols-8 {
        grid-template-columns: minmax(60px, 80px) repeat(7, minmax(100px, 1fr));
    }
    
    /* Ensure calendar cells have relative positioning for absolute schedule cards */
    .calendar-grid [class*="grid-cols"] > div {
        position: relative;
    }
    
    /* Compact calendar cells */

    }

    }
    
    .calendar-grid .absolute:hover {

    }

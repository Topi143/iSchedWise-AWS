<!-- Shared Reports Styles -->
<style>
    /* ==========================================
       REPORTS PAGES - SHARED UI STYLES
       ========================================== */
    
    /* Custom Scrollbar - scoped to page content to avoid sidebar leakage */
    #mainContentArea .overflow-y-auto::-webkit-scrollbar,
    #mainContentArea .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
    }
    #mainContentArea .overflow-y-auto::-webkit-scrollbar-track,
    #mainContentArea .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }
    #mainContentArea .overflow-y-auto::-webkit-scrollbar-thumb,
    #mainContentArea .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.4);
        border-radius: 4px;
    }
    #mainContentArea .overflow-y-auto::-webkit-scrollbar-thumb:hover,
    #mainContentArea .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.6);
    }

    /* Toast Notifications - Matches Dashboard */
    .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 90vw;
        pointer-events: none;
    }

    .toast {
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        background: white;
        border-radius: 0.5rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        animation: toastSlideIn 0.4s ease both;
        min-width: 250px;
        max-width: 400px;
        pointer-events: auto;
    }

    .toast.removing {
        animation: toastSlideOut 0.3s ease both;
    }

    @keyframes toastSlideIn {
        from { transform: translateX(120%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }

    @keyframes toastSlideOut {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(120%); opacity: 0; }
    }

    .toast-success { border-left: 4px solid #10b981; }
    .toast-error { border-left: 4px solid #ef4444; }
    .toast-danger { border-left: 4px solid #ef4444; }
    .toast-info { border-left: 4px solid #3b82f6; }
    .toast-warning { border-left: 4px solid #f59e0b; }

    /* Fixed-Viewport Layout contract */
    @media (min-width: 1024px) {
        .reports-page-shell {
            height: 100vh;
            overflow: hidden;
        }

        .reports-page-inner {
            min-height: 0;
        }
    }

    @media (max-width: 1023px) {
        .reports-page-shell {
            height: auto !important;
            min-height: auto !important;
            overflow: visible !important;
        }

        .reports-page-inner {
            height: auto !important;
            min-height: auto !important;
            overflow: visible !important;
        }
    }
    
    /* Stat Card Styles */
    .stat-card {
        transition: all 0.2s ease;
        border: 1px solid #e5e7eb;
        background: white;
        border-radius: 0.5rem;
    }
    
    .stat-card.insight-card { }
    
    .progress-bar {
        transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .chart-container {
        position: relative;
        height: 220px;
        margin: 10px 0;
    }
    
    .chart-container-large {
        position: relative;
        height: 280px;
        margin: 10px 0;
    }
    
    html {
        scroll-behavior: smooth;
    }
    
    .table-hover tbody tr {
        transition: all 0.15s ease;
    }
    .table-hover tbody tr:hover {
        background-color: #f8fafc;
    }
    
    .insight-icon {
        transition: transform 0.2s ease;
    }
    
    .chart-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
    }
    
    .reports-content .section-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        color: #111827;
    }
    .reports-content .section-title svg {
        flex-shrink: 0;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .fade-in {
        animation: fadeIn 0.3s ease;
    }
    
    /* Loading state for buttons */
    .button-loading {
        position: relative;
        pointer-events: none;
        opacity: 0.7;
    }
    .button-loading::after {
        content: '';
        position: absolute;
        width: 16px;
        height: 16px;
        top: 50%;
        left: 50%;
        margin-left: -8px;
        margin-top: -8px;
        border: 2px solid #ffffff;
        border-radius: 50%;
        border-top-color: transparent;
    }
    
    /* ==========================================
       RESPONSIVE - MOBILE FIRST
       ========================================== */
    
    @media (max-width: 768px) {
        .reports-content .stat-card {
            padding: 0.75rem !important;
        }

        .reports-content .stat-card .stat-icon {
            padding: 0.5rem !important;
            width: 2.5rem;
            height: 2.5rem;
        }

        .reports-content .stat-card .stat-icon svg {
            width: 1.25rem !important;
            height: 1.25rem !important;
        }

        .reports-content .overflow-x-auto {
            -webkit-overflow-scrolling: touch;
        }

        .reports-content .overflow-x-auto table {
            min-width: 600px;
        }

        .reports-content .reports-toolbar {
            width: 100%;
            justify-content: stretch;
        }

        .reports-content .reports-toolbar > * {
            flex: 1 1 100%;
            min-width: 0;
        }
    }

    @media (max-width: 640px) {
        .reports-content {
            padding: 0.5rem !important;
        }

        .reports-content .chart-container {
            height: 180px;
        }

        .reports-content .chart-container-large {
            height: 220px;
        }

        .reports-content button,
        .reports-content a,
        .reports-content select,
        .reports-content input {
            min-height: 38px;
        }

        .reports-content .reports-toolbar {
            gap: 0.5rem;
        }

        .reports-content .reports-toolbar > * {
            flex: 1 1 calc(50% - 0.25rem);
        }

        .reports-content .reports-toolbar button,
        .reports-content .reports-toolbar .inline-flex,
        .reports-content .reports-toolbar select {
            width: 100%;
            justify-content: center;
        }

        .reports-content table {
            font-size: 0.75rem !important;
        }

        .reports-content table th,
        .reports-content table td {
            padding: 0.5rem !important;
        }
    }

    @media (max-width: 380px) {
        .reports-content .reports-toolbar > * {
            flex: 1 1 100%;
        }
    }

    /* Responsive modal */
    @media (max-width: 640px) {
        #ai-modal-content {
            max-width: 98vw !important;
            max-height: 95vh !important;
            margin: 0.25rem !important;
        }

        #ai-modal-content .p-8 {
            padding: 0.75rem !important;
        }

        #ai-modal-content .px-8 {
            padding-left: 0.75rem !important;
            padding-right: 0.75rem !important;
        }

        #ai-modal-content .py-6 {
            padding-top: 0.75rem !important;
            padding-bottom: 0.75rem !important;
        }
    }

    /* Shared toolbar and table wrappers for reports pages */
    .reports-toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
        flex-wrap: wrap;
    }

    .reports-table-wrap {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 768px) {
        .reports-toolbar {
            width: 100%;
            justify-content: stretch;
        }

        .reports-toolbar > * {
            flex: 1 1 100%;
            min-width: 0;
        }

        .reports-table-mobile {
            min-width: 100% !important;
            table-layout: auto !important;
        }

        .reports-table-mobile colgroup,
        .reports-table-mobile thead {
            display: none;
        }

        .reports-table-mobile tbody {
            display: block;
        }

        .reports-table-mobile tbody tr.reports-table-data-row {
            display: block;
            margin-bottom: 0.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 0.5rem;
            background: #ffffff;
        }

        .dark .reports-table-mobile tbody tr.reports-table-data-row {
            background: #1f2937;
            border-color: #374151;
        }

        .reports-table-mobile tbody tr.reports-table-data-row td {
            display: flex;
            width: 100% !important;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            border: 0 !important;
            padding: 0.4rem 0.25rem !important;
            text-align: right !important;
        }

        .reports-table-mobile tbody tr.reports-table-data-row td::before {
            content: attr(data-label);
            font-size: 0.65rem;
            line-height: 1rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            text-align: left;
            flex: 0 0 42%;
        }

        .dark .reports-table-mobile tbody tr.reports-table-data-row td::before {
            color: #9ca3af;
        }

        .reports-table-mobile tbody tr.reports-table-empty-row {
            display: table-row;
        }

        .reports-table-mobile tbody tr.reports-table-empty-row td {
            text-align: center !important;
        }

        .reports-table-wrap {
            overflow-x: visible;
        }
    }

    /* ========================================
       DARK MODE OVERRIDES FOR REPORTS
    ======================================== */

    .dark .reports-content .stat-card {
        background: #1e293b;
        border-color: #334155;
    }

    .dark .reports-content .chart-card {
        background: #1e293b;
        border-color: #334155;
    }

    .dark .reports-content .section-title {
        color: #f1f5f9;
    }

    .dark .reports-content .table-hover tbody tr:hover {
        background-color: #334155;
    }

    .dark .toast {
        background: #1e293b;
        border-color: #334155;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    /* Dark scrollbar overrides */
    .dark #mainContentArea .overflow-y-auto::-webkit-scrollbar-thumb,
    .dark #mainContentArea .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(100, 116, 139, 0.5);
    }
    .dark #mainContentArea .overflow-y-auto::-webkit-scrollbar-thumb:hover,
    .dark #mainContentArea .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.7);
    }

    /* Dark button loading spinner */
    .dark .button-loading::after {
        border-color: rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

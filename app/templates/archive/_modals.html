<!-- Archive Shared Modals - Included by all archive pages -->

<!-- Unified Delete Confirmation Modal -->
<div id="unifiedDeleteModal" class="hidden fixed inset-0 bg-black/40 modal-backdrop z-[60] flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg max-w-sm w-full animate-scale-in overflow-hidden">
        <div class="bg-red-600 px-5 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </div>
                    <h3 class="text-base font-semibold text-white" id="deleteModalTitle">Delete Item</h3>
                </div>
                <button onclick="closeUnifiedDeleteModal()" class="text-white/80 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="p-5">
            <input type="hidden" id="unified_delete_id">
            <input type="hidden" id="unified_delete_type">
            <p class="text-gray-700 text-sm mb-3" id="deleteModalMessage">Are you sure you want to permanently delete this item?</p>
            <div id="deleteModalWarnings" class="space-y-2 mb-4"></div>
            <div class="bg-red-50 border-l-4 border-red-400 p-3 rounded-r flex items-start gap-2">
                <svg class="w-4 h-4 text-red-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>
                <p class="text-xs text-red-700 font-medium">This action cannot be undone.</p>
            </div>
        </div>
        <div class="px-5 pb-5 flex flex-col-reverse sm:flex-row gap-2 sm:gap-3">
            <button type="button" onclick="closeUnifiedDeleteModal()" class="w-full sm:flex-1 px-4 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors text-sm font-medium">Cancel</button>
            <button type="button" id="unifiedDeleteConfirmBtn" onclick="confirmUnifiedDelete()" class="w-full sm:flex-1 px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors text-sm font-medium">Delete</button>
        </div>
    </div>
</div>

<!-- Unified Restore Confirmation Modal -->
<div id="unifiedRestoreModal" class="hidden fixed inset-0 bg-black/40 modal-backdrop z-[60] flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg max-w-sm w-full animate-scale-in overflow-hidden">
        <div class="bg-emerald-600 px-5 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </div>
                    <h3 class="text-base font-semibold text-white" id="restoreModalTitle">Restore Item</h3>
                </div>
                <button onclick="closeUnifiedRestoreModal()" class="text-white/80 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="p-5">
            <input type="hidden" id="unified_restore_id">
            <input type="hidden" id="unified_restore_type">
            <p class="text-gray-700 text-sm mb-4" id="restoreModalMessage">Are you sure you want to restore this item?</p>
            <div class="bg-emerald-50 border-l-4 border-emerald-400 p-3 rounded-r flex items-start gap-2">
                <svg class="w-4 h-4 text-emerald-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <p class="text-xs text-emerald-700" id="restoreModalInfo">This item will be moved back to the active list.</p>
            </div>
        </div>
        <div class="px-5 pb-5 flex flex-col-reverse sm:flex-row gap-2 sm:gap-3">
            <button type="button" onclick="closeUnifiedRestoreModal()" class="w-full sm:flex-1 px-4 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors text-sm font-medium">Cancel</button>
            <button type="button" id="unifiedRestoreConfirmBtn" onclick="confirmUnifiedRestore()" class="w-full sm:flex-1 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors text-sm font-medium">Restore</button>
        </div>
    </div>
</div>

<!-- Archive Detail Preview Modal -->
<div id="archiveDetailModal" class="hidden fixed inset-0 bg-black/40 modal-backdrop z-[60] flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full animate-scale-in overflow-hidden max-h-[90vh] flex flex-col">
        <div class="bg-blue-600 px-5 py-4 flex-shrink-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <h3 class="text-base font-semibold text-white">Archive Details</h3>
                </div>
                <button onclick="closeArchiveDetailModal()" class="text-white/80 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="p-5 overflow-y-auto flex-1" id="archiveDetailContent">
            <div class="text-center py-8">
                <div class="animate-spin w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mx-auto"></div>
                <p class="text-gray-500 mt-2">Loading details...</p>
            </div>
        </div>
        <div class="px-5 pb-5 flex flex-col-reverse sm:flex-row gap-2 sm:gap-3 flex-shrink-0 border-t border-gray-100 pt-4">
            <button type="button" onclick="closeArchiveDetailModal()" class="w-full sm:flex-1 px-4 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors text-sm font-medium">Close</button>
        </div>
    </div>
</div>

<!-- Bulk Delete/Restore modals are now handled by BatchSelect.js -->

<!-- Archive Shared JavaScript - Included by all archive pages -->
<script>
    // Move archive modal roots to <body> so fixed backdrops span the whole app shell.
    function ensureArchiveModalsInBody() {
        const modalIds = ['unifiedDeleteModal', 'unifiedRestoreModal', 'archiveDetailModal'];
        modalIds.forEach((id) => {
            const modal = document.getElementById(id);
            if (modal && modal.parentElement !== document.body) {
                document.body.appendChild(modal);
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', ensureArchiveModalsInBody, { once: true });
    } else {
        ensureArchiveModalsInBody();
    }

    // ============================================
    // SHARED UTILITIES
    // ============================================
    
    // Helper function to get CSRF token from cookie
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return '';
    }
    
    // Helper function to escape strings for use in onclick handlers
    function escapeForOnClick(str) {
        if (!str) return '';
        return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
    
    // Utility date/time formatting functions
    function formatDate(dateString) {
        if (!dateString) return 'N/A';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    
    function formatTime(timeString) {
        if (!timeString) return 'N/A';
        const parts = timeString.split(':');
        const hours = parseInt(parts[0]);
        const minutes = parts[1];
        const ampm = hours >= 12 ? 'PM' : 'AM';
        const displayHours = hours % 12 || 12;
        return `${displayHours}:${minutes} ${ampm}`;
    }
    
    function formatDateTime(dateTimeString) {
        if (!dateTimeString) return 'N/A';
        const date = new Date(dateTimeString);
        return date.toLocaleString('en-US', { 
            year: 'numeric', 
            month: 'short', 
            day: 'numeric',
            hour: 'numeric',
            minute: '2-digit'
        });
    }

    function formatRelativeTime(dateTimeString) {
        if (!dateTimeString) return '';
        const date = new Date(dateTimeString);
        const now = new Date();
        const diffMs = now - date;
        const diffSec = Math.floor(diffMs / 1000);
        const diffMin = Math.floor(diffSec / 60);
        const diffHr = Math.floor(diffMin / 60);
        const diffDay = Math.floor(diffHr / 24);
        const diffWeek = Math.floor(diffDay / 7);
        const diffMonth = Math.floor(diffDay / 30);
        const diffYear = Math.floor(diffDay / 365);

        if (diffSec < 60) return 'Just now';
        if (diffMin < 60) return `${diffMin}m ago`;
        if (diffHr < 24) return `${diffHr}h ago`;
        if (diffDay === 1) return 'Yesterday';
        if (diffDay < 7) return `${diffDay}d ago`;
        if (diffWeek < 5) return `${diffWeek}w ago`;
        if (diffMonth < 12) return `${diffMonth}mo ago`;
        return `${diffYear}y ago`;
    }

    function formatDateTimeWithRelative(dateTimeString) {
        if (!dateTimeString) return 'N/A';
        const abs = formatDateTime(dateTimeString);
        const rel = formatRelativeTime(dateTimeString);
        return rel ? `${abs} <span class="archive-meta-relative">(${rel})</span>` : abs;
    }

    // ============================================
    // TOAST NOTIFICATION SYSTEM
    // ============================================
    
    function showToast(message, type = 'success') {
    if (window.__iswToastManager && typeof window.__iswToastManager.show === 'function') {
        return window.__iswToastManager.show.apply(window.__iswToastManager, arguments);
    }
        let container = document.getElementById('toastContainer');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container';
            document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        
        const icons = {
            success: '<svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>',
            error: '<svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>',
            danger: '<svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>',
            warning: '<svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>',
            info: '<svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
        };
        
        toast.innerHTML = `
            <div class="flex items-center">
                ${icons[type] || icons.info}
                <div class="ml-3 flex-1">
                    <p class="text-sm font-medium text-gray-900">${message}</p>
                </div>
                <button onclick="removeToast(this.parentElement.parentElement)" class="ml-4 text-gray-400 hover:text-gray-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        `;
        
        container.appendChild(toast);
        setTimeout(() => removeToast(toast), 5000);
    }
    
    function removeToast(toast) {
        if (!toast || !toast.parentElement) return;
        toast.classList.add('removing');
        setTimeout(() => toast.remove(), 300);
    }

            </div>

        document.body.classList.add('overflow-hidden');

            const response = await fetch(`/archive/api/archives/${archiveId}`);

    function openUnifiedDeleteModal(id, type, displayName = '') {
        const config = deleteConfigs[type];
        if (!config) return;
        
        document.getElementById('unified_delete_id').value = id;
        document.getElementById('unified_delete_type').value = type;
        document.getElementById('deleteModalTitle').textContent = config.title;
        document.getElementById('deleteModalMessage').innerHTML = displayName 
            ? `Delete <strong class="text-red-600">${displayName}</strong>?`
            : config.message;
        document.getElementById('deleteModalWarnings').innerHTML = config.warnings;
        document.getElementById('unifiedDeleteModal').classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
    }
    
    function closeUnifiedDeleteModal() {
        document.getElementById('unifiedDeleteModal').classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
    }
    
    async function confirmUnifiedDelete() {
        const id = document.getElementById('unified_delete_id').value;
        const type = document.getElementById('unified_delete_type').value;
        const config = deleteConfigs[type];
        
        if (!config) { closeUnifiedDeleteModal(); return; }

        const btn = document.getElementById('unifiedDeleteConfirmBtn');
        if (btn) { btn.classList.add('btn-loading'); btn.innerHTML = '<span class="btn-spinner"></span>Deleting...'; }
        
        try {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || getCookie('csrf_token');
            const response = await fetch(config.endpoint(id), {
                method: config.method,
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }
            });
            
            const data = await response.json();
            closeUnifiedDeleteModal();
            
            if (data.success) {
                showToast(data.message || 'Deleted successfully', 'success');
                config.onSuccess();
            } else {
                showToast('Error: ' + (data.message || 'Failed to delete'), 'error');
            }
        } catch (error) {
            console.error('Error:', error);
            closeUnifiedDeleteModal();
            showToast('Error deleting item', 'error');
        } finally {
            if (btn) { btn.classList.remove('btn-loading'); btn.innerHTML = 'Delete'; }
        }
    }

    // ENTITY FILTER HELPERS
    // ============================================
    
    function clearEntityFilters(entityType) {
        const searchInput = document.getElementById(`${entityType}ArchiveSearch`);
        if (searchInput) searchInput.value = '';
        // Exit batch select mode if active
        if (typeof BatchSelect !== 'undefined') BatchSelect.exit('arch' + entityType.charAt(0).toUpperCase() + entityType.slice(1));
        if (entityType === 'curriculum' && typeof loadArchivedCurricula === 'function') loadArchivedCurricula();
        else if ((entityType === 'program' || entityType === 'program') && typeof loadArchivedDepartments === 'function') loadArchivedDepartments();
        else if (entityType === 'faculty' && typeof loadArchivedFaculty === 'function') loadArchivedFaculty();
        else if (entityType === 'building' && typeof loadArchivedBuildings === 'function') loadArchivedBuildings();
        showToast('Filters cleared', 'info');
    }

    // ============================================
    // ENTITY EXPORT FUNCTIONS
    // ============================================
    
    function exportEntity(entityType, format) {
        const url = `/archive/export/${entityType}/${format}`;
        window.open(url, '_blank');
        showToast(`Exporting ${entityType} archives to ${format.toUpperCase()}...`, 'info');
    }
</script>
